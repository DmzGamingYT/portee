[package]
name = "spotifycraft-import-core"
version = "0.1.0"
edition = "2021"
description = "Lecture des tags audio et des pochettes intégrées pour SpotifyCraft (WASM)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
