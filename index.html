<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#121212" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Thème appliqué avant la peinture, pour éviter tout flash clair/sombre :
      // on relit ici le mode mémorisé par les préférences (« suivre le
      // système » par défaut), puis `useAutoTheme` prend le relais — y compris
      // pour les changements de réglage du système.
      (function () {
        var mode = 'auto';
        try {
          var saved = JSON.parse(localStorage.getItem('spotifycraft-store') || 'null');
          if (saved && saved.state && saved.state.themeMode) mode = saved.state.themeMode;
        } catch (error) {
          // stockage indisponible : on suit le système
        }
        var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        var theme = mode === 'auto' ? (prefersLight ? 'light' : 'dark') : mode;
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#f6f6f6' : '#121212');
      })();
    </script>
    <meta
      name="description"
      content="Portée — lecteur musical open source de la collection Craftline : recherche, albums, playlists, file d'attente, paroles, extraits officiels de 30 s et bibliothèque audio locale, sans clé API."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Portée — lecteur musical open source" />
    <meta
      property="og:description"
      content="Recherche, albums, artistes, playlists et file d'attente. Extraits officiels de 30 s via iTunes, métadonnées Spotify en option, et fichiers audio locaux complets."
    />
    <meta property="og:image" content="/favicon.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Portée" />
    <meta
      name="twitter:description"
      content="Lecteur musical open source : extraits officiels, playlists, historique, file d'attente et fichiers audio locaux."
    />
    <title>Portée</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
