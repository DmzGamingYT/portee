<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#121212" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Thème automatique jour/nuit, sans bascule ni icône : appliqué avant la
      // peinture pour éviter tout flash, puis repris par `useAutoTheme`.
      (function () {
        var media = window.matchMedia('(prefers-color-scheme: light)');
        var apply = function () {
          var theme = media.matches ? 'light' : 'dark';
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f6f6f6' : '#121212');
        };
        apply();
        media.addEventListener('change', apply);
      })();
    </script>
    <meta
      name="description"
      content="SpotifyCraft — clone open-source de Spotify : recherche, albums, playlists, file d'attente, extraits officiels de 30 s et bibliothèque audio locale, sans clé API."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SpotifyCraft — lecteur musical open-source" />
    <meta
      property="og:description"
      content="Recherche, albums, artistes, playlists et file d'attente. Extraits officiels de 30 s via iTunes, métadonnées Spotify en option, et fichiers audio locaux complets."
    />
    <meta property="og:image" content="/favicon.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SpotifyCraft" />
    <meta
      name="twitter:description"
      content="Clone open-source de Spotify : extraits officiels, playlist, historique, file d'attente et fichiers audio locaux."
    />
    <title>SpotifyCraft</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
